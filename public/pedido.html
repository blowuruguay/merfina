<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu pedido — Merfina</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css?v=6">
<style>
  body { background: var(--cream); }
  .nav-simple { padding: 28px 40px; text-align: center; border-bottom: 1px solid #e6ddcf; }
  .nav-simple a { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
  .nav-simple img { height: 32px; }
  .nav-simple span { font-family: 'Cormorant Garamond', serif; letter-spacing: .32em; color: #8F7349; font-size: 18px; }

  .pg-wrap { max-width: 720px; margin: 0 auto; padding: 80px 24px 100px; text-align: center; }
  .pg-icon { width: 90px; height: 90px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 36px; }
  .pg-icon svg { width: 44px; height: 44px; stroke-width: 2; }
  .pg-icon.ok   { background: #e2f0e6; color: #4a8f5c; }
  .pg-icon.pend { background: #faefdf; color: #c6904a; }
  .pg-icon.err  { background: #f5e2db; color: #b4553c; }
  .pg-icon.bank { background: #f3eadb; color: #8F7349; }

  .pg-eyebrow { color: #8a8276; font-size: 10.5px; letter-spacing: .42em; text-transform: uppercase; margin-bottom: 20px; }
  h1 { font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: clamp(36px, 5vw, 56px); color: #141210; margin: 0 0 20px; line-height: 1.05; letter-spacing: -.005em; }
  .pg-sub { color: #6a6054; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 18px; line-height: 1.6; margin: 0 0 40px; }

  .pg-box { background: #FBF7F0; border: 1px solid #e6ddcf; padding: 28px; margin: 0 0 32px; display: inline-block; text-align: left; min-width: 320px; }
  .pg-box .lb { color: #8a8276; font-size: 10.5px; letter-spacing: .3em; text-transform: uppercase; }
  .pg-box .vl { font-family: 'Cormorant Garamond', serif; color: #141210; font-size: 22px; margin-top: 6px; }
  .pg-box .vl.gold { color: #8F7349; font-style: italic; }

  /* Datos bancarios */
  .banco-card {
    background: #fff;
    border: 1px solid #e6ddcf;
    padding: 32px;
    margin: 0 auto 32px;
    text-align: left;
    max-width: 520px;
    border-radius: 2px;
  }
  .banco-card h3 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: 24px;
    color: #141210;
    margin: 0 0 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid #e6ddcf;
  }
  .banco-ln {
    display: grid;
    grid-template-columns: 140px 1fr auto;
    gap: 12px;
    padding: 10px 0;
    align-items: center;
  }
  .banco-ln + .banco-ln { border-top: 1px solid #f3eadb; }
  .banco-ln .lb {
    color: #8a8276;
    font-size: 10.5px;
    letter-spacing: .3em;
    text-transform: uppercase;
  }
  .banco-ln .vl {
    font-family: 'Cormorant Garamond', serif;
    color: #141210;
    font-size: 18px;
  }
  .banco-ln .vl.big { font-size: 22px; color: #8F7349; font-style: italic; }
  .banco-copy {
    background: none; border: 1px solid #e6ddcf;
    padding: 6px 10px; cursor: pointer;
    font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
    color: #6a6054;
    font-family: 'Montserrat', sans-serif;
    border-radius: 2px;
    transition: all .2s;
  }
  .banco-copy:hover { border-color: #B89766; color: #8F7349; }
  .banco-copy.ok { background: #e2f0e6; border-color: #4a8f5c; color: #4a8f5c; }

  .banco-pasos {
    margin-top: 24px;
    padding: 20px;
    background: #f8f3e9;
    border-left: 3px solid #B89766;
    text-align: left;
    max-width: 520px;
    margin-left: auto;
    margin-right: auto;
    font-family: 'Cormorant Garamond', serif;
    color: #2b251e;
    font-size: 16px;
    line-height: 1.7;
  }
  .banco-pasos strong { color: #141210; }

  .pg-ctas { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .pg-btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 16px 28px;
    font-family: 'Montserrat', sans-serif;
    font-size: 11px; letter-spacing: .36em; text-transform: uppercase;
    text-decoration: none; cursor: pointer; border-radius: 2px;
    transition: all .2s;
  }
  .pg-btn.primary { background: #25D366; color: #fff; border: 1px solid #25D366; }
  .pg-btn.primary:hover { background: #1ea855; border-color: #1ea855; }
  .pg-btn.dark { background: #141210; color: var(--cream); border: 1px solid #141210; }
  .pg-btn.dark:hover { background: #8F7349; border-color: #8F7349; }
  .pg-btn.out { background: transparent; color: #141210; border: 1px solid #d8cfbe; }
  .pg-btn.out:hover { border-color: #141210; }
  .pg-btn svg { width: 16px; height: 16px; }

  @media (max-width: 640px) {
    .banco-card { padding: 22px; }
    .banco-ln { grid-template-columns: 1fr auto; gap: 8px; }
    .banco-ln .lb { grid-column: 1 / -1; }
    .pg-ctas { flex-direction: column; width: 100%; max-width: 320px; margin: 10px auto 0; }
    .pg-btn { width: 100%; justify-content: center; min-height: 54px; padding: 16px 20px !important; letter-spacing: .3em !important; }
  }
</style>
</head>
<body>

<nav class="nav-simple">
  <a href="/">
    <img src="/img/logo-gold.png" alt="Merfina">
    <span>MERFINA</span>
  </a>
</nav>

<main class="pg-wrap" id="main">
  <div class="pg-eyebrow">Cargando…</div>
</main>

<script>
const estado = location.pathname.split('/')[2] || 'exito';
const params = new URLSearchParams(location.search);
const pedidoId = params.get('id') || localStorage.getItem('merfina_last_pedido');

const CONFIG = {
  exito: {
    cls: 'ok',
    eyebrow: 'Gracias',
    titulo: '¡Compra confirmada!',
    sub: 'Recibimos tu pedido y ya estamos preparándolo. Te vamos a avisar por mail cuando lo despachemos.',
    svg: '<path d="M20 6L9 17l-5-5"/>'
  },
  pendiente: {
    cls: 'pend',
    eyebrow: 'En proceso',
    titulo: 'Tu pago está pendiente',
    sub: 'Mercado Pago está confirmando el pago. Te vamos a avisar por mail apenas se acredite.',
    svg: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>'
  },
  error: {
    cls: 'err',
    eyebrow: 'Hubo un problema',
    titulo: 'El pago no se completó',
    sub: 'Tu pedido quedó guardado. Podés intentar pagar de nuevo o escribirnos por WhatsApp.',
    svg: '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16v.5"/>'
  },
  transferencia: {
    cls: 'bank',
    eyebrow: 'Casi listo',
    titulo: 'Reservamos tu pedido',
    sub: 'Transferí el total a la cuenta de abajo y mandanos el comprobante por WhatsApp. Al confirmar la transferencia preparamos el envío.',
    svg: '<path d="M4 7l8-4 8 4M4 7v10h16V7M4 7h16M8 11v4M12 11v4M16 11v4"/>'
  }
};

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function cargar() {
  const cfg = CONFIG[estado] || CONFIG.exito;

  // Pedido
  let pedido = null;
  if (pedidoId) {
    try {
      const r = await fetch('/api/checkout/pedido/' + pedidoId);
      const data = await r.json();
      if (r.ok && data.pedido) pedido = data.pedido;
    } catch {}
  }

  // Si es transferencia, cargamos los datos bancarios
  let banco = null;
  if (estado === 'transferencia') {
    try {
      const r = await fetch('/api/checkout/datos-banco');
      if (r.ok) banco = await r.json();
    } catch {}
  }

  let pedidoHtml = '';
  if (pedido) {
    pedidoHtml = `
      <div class="pg-box">
        <div class="lb">Número de pedido</div>
        <div class="vl">#${pedido.numero}</div>
        <div class="lb" style="margin-top:16px">Total</div>
        <div class="vl gold">$ ${Number(pedido.total).toLocaleString('es-UY')}</div>
      </div>`;
  }

  let bancoHtml = '';
  if (estado === 'transferencia' && banco) {
    const total = pedido ? `$ ${Number(pedido.total).toLocaleString('es-UY')}` : '—';
    const waText = encodeURIComponent(
      `Hola Merfina, hice la transferencia del pedido #${pedido?.numero || ''}. Adjunto el comprobante.`);
    bancoHtml = `
      <div class="banco-card">
        <h3>Datos para transferir</h3>
        <div class="banco-ln">
          <div class="lb">Banco</div>
          <div class="vl">${esc(banco.banco)}</div>
          <button class="banco-copy" data-copy="${esc(banco.banco)}">Copiar</button>
        </div>
        <div class="banco-ln">
          <div class="lb">Titular</div>
          <div class="vl">${esc(banco.titular)}</div>
          <button class="banco-copy" data-copy="${esc(banco.titular)}">Copiar</button>
        </div>
        <div class="banco-ln">
          <div class="lb">Nº de cuenta</div>
          <div class="vl big">${esc(banco.cuenta)}</div>
          <button class="banco-copy" data-copy="${esc(banco.cuenta)}">Copiar</button>
        </div>
        ${banco.sucursal ? `
        <div class="banco-ln">
          <div class="lb">Sucursal</div>
          <div class="vl">${esc(banco.sucursal)}</div>
          <button class="banco-copy" data-copy="${esc(banco.sucursal)}">Copiar</button>
        </div>` : ''}
        ${banco.rut ? `
        <div class="banco-ln">
          <div class="lb">RUT</div>
          <div class="vl">${esc(banco.rut)}</div>
          <button class="banco-copy" data-copy="${esc(banco.rut)}">Copiar</button>
        </div>` : ''}
        <div class="banco-ln">
          <div class="lb">Monto a transferir</div>
          <div class="vl big">${total}</div>
          <button class="banco-copy" data-copy="${pedido?.total || ''}">Copiar</button>
        </div>
      </div>

      <div class="banco-pasos">
        <strong>Siguientes pasos:</strong><br>
        1. Transferí el total a la cuenta de arriba.<br>
        2. Mandanos el comprobante por WhatsApp con tu número de pedido.<br>
        3. Al verificar el pago, despachamos tu pedido y te avisamos por mail.
      </div>

      <div class="pg-ctas">
        <a href="https://wa.me/59891900341?text=${waText}" target="_blank" rel="noopener" class="pg-btn primary">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15l-1.4 5 5.1-1.3A10 10 0 1 0 12 2z"/></svg>
          Enviar comprobante por WhatsApp
        </a>
        <a href="/tienda" class="pg-btn out">Seguir mirando</a>
      </div>
    `;
  }

  document.getElementById('main').innerHTML = `
    <div class="pg-icon ${cfg.cls}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">${cfg.svg}</svg>
    </div>
    <div class="pg-eyebrow">${cfg.eyebrow}</div>
    <h1>${cfg.titulo}</h1>
    <p class="pg-sub">${cfg.sub}</p>
    ${estado === 'transferencia' ? pedidoHtml : pedidoHtml}
    ${bancoHtml}
    ${estado !== 'transferencia' ? `
      <div class="pg-ctas">
        ${estado === 'error' ? `<a href="/checkout" class="pg-btn dark">Reintentar</a>` : ''}
        <a href="/tienda" class="pg-btn ${estado === 'error' ? 'out' : 'dark'}">Seguir mirando</a>
        <a href="https://wa.me/59891900341" target="_blank" class="pg-btn out">Escribirnos por WhatsApp</a>
      </div>` : ''}
  `;

  // Botones de copiar
  document.querySelectorAll('.banco-copy').forEach(b => {
    b.onclick = async () => {
      try {
        await navigator.clipboard.writeText(b.dataset.copy);
        b.classList.add('ok');
        b.textContent = 'Copiado';
        setTimeout(() => { b.classList.remove('ok'); b.textContent = 'Copiar'; }, 1600);
      } catch {}
    };
  });
}
cargar();
</script>
</body>
</html>
